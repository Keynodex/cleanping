[workspace]
resolver = "2"
members = ["crates/cleanping-core", "crates/cleanping-cli"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Keynodex/cleanping"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
