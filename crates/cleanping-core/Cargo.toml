[package]
name = "cleanping-core"
description = "Core logic for cleanping: validation, version history, storage and the rewrite use case."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "json"] }
url = "2.5.8"

[dev-dependencies]
flate2 = "1.1.10"
tempfile = "3.27.0"
