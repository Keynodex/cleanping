[package]
name = "cleanping-cli"
description = "Command-line prompt polisher: rewrite text with an OpenAI-compatible API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "cleanping"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
cleanping-core = { path = "../cleanping-core" }
crossterm = { version = "0.29.0", default-features = false, features = ["events", "use-dev-tty"] }

[dev-dependencies]
serde_json = "1.0.151"
tempfile = "3.27.0"
