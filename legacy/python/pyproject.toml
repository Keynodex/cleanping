[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanping"
version = "0.1.0"
description = "Local prompt polisher: rewrite a draft with an OpenAI-compatible API and copy the result."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cleanping = "cleanping.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
